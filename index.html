<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DigiYatra Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Concept: a phone-sized prototype. Warm neutrals with soft sky, mint, butter and coral. Jetty the jet leads every step. */
:root{--bg:#F7F4EE;--stage:#E9E4D9;--ink:#1F2430;--card:#FFFFFF;--line:#E4DFD5;--muted:#5B6270;--body:#3A4150;--coral:#FF8A6B;--sky:#DCEBF7;--butter:#FBE9B7;--mint:#D5EFEA;--blush:#FFE0D6;--sand:#E9E4D9;--sun:#F6C85F;--teal:#3E9C8F;--teal2:#4FB6A8;--head:'Baloo 2',system-ui,sans-serif;--text:'Nunito',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:24px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{position:relative;width:min(390px,100%);height:min(844px,calc(100dvh - 40px));min-height:600px;background:var(--bg);border:8px solid var(--ink);border-radius:40px;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 20px 0;overflow-y:auto;overflow-x:hidden}
.in{animation:slide .3s ease both}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.controls{width:min(300px,100%);background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.controls h2{margin:0;font-family:var(--head);font-size:22px}
.controls h3{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.controls p{margin:0;font-size:14px;line-height:1.4;color:var(--body)}
.jg{display:flex;flex-wrap:wrap;gap:6px}
.jb{min-height:36px;padding:0 12px;border:2px solid var(--line);border-radius:18px;background:var(--bg);font-size:14px;font-weight:700}
.jb:hover{border-color:var(--ink)}
.jb.reset{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:440px){.stage{padding-top:8px;gap:16px}.device{border-width:0;border-radius:28px;height:calc(100dvh - 24px)}}
h1{margin:0;font-family:var(--head);font-size:32px;line-height:36px;font-weight:700}
.c{text-align:center}
.lead{margin:8px 0 0;font-size:18px;line-height:25px;font-weight:700;color:var(--body)}
.fine{margin:8px 0 0;font-size:14px;line-height:19px;font-weight:700;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.back{width:48px;height:48px;flex:none;border-radius:24px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.bars{display:flex;gap:6px;flex:1}.bars i{height:8px;flex:1;border-radius:4px;background:#DDD7CB}.bars i.on{background:var(--coral)}
.step{font-size:15px;font-weight:800;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:60px;padding:0 14px;line-height:1.1;text-align:center;border:0;border-radius:30px;background:var(--coral);color:var(--ink);font-family:var(--head);font-size:22px;font-weight:700}
.btn:disabled{background:var(--sand);color:var(--muted);cursor:not-allowed}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--ink);height:52px;font-size:20px}
.btn.sm{height:48px;font-size:18px;width:auto;padding:0 18px;border-radius:24px}
.cta{position:sticky;bottom:0;margin:auto -20px 0;padding:12px 20px 20px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.nav{position:sticky;bottom:0;margin:auto -20px 0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:2px solid var(--ink);flex:none}
.nav button{height:72px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:800;color:var(--muted)}
.nav button.on{color:var(--ink);box-shadow:inset 0 5px 0 var(--sun)}
.pad{flex:none;height:14px}
.say{display:flex;align-items:flex-end;gap:6px;margin-top:12px}
.say .j{flex:none;transform:rotate(-4deg)}
.bubble{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;margin-bottom:10px;font-size:18px;line-height:24px;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 10px;border-radius:20px;background:var(--card);border:2px solid var(--line);font-size:18px;line-height:22px;font-weight:800}
.row .ico{width:40px;height:40px;flex:none;border-radius:20px;display:grid;place-items:center;background:var(--t,var(--sky))}
.tile{background:var(--t,var(--sky));border:0}
.lbl{font-size:16px;font-weight:800;color:var(--muted);margin:14px 0 6px}
.field{width:100%;height:56px;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:0 16px;font-size:20px;font-weight:700}
.field:focus{border-color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{min-height:52px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-family:var(--head);font-size:22px;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.txt{font-family:var(--text);font-size:17px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:14px;font-weight:800;background:var(--sun)}
.panel{border-radius:28px;background:var(--sky);position:relative;overflow:hidden;display:grid;place-items:center}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.key{height:62px;border:2px solid var(--line);border-radius:20px;background:var(--card);font-family:var(--head);font-size:28px;font-weight:700;display:grid;place-items:center}
.key:active{background:var(--sand)}
.dots{display:flex;justify-content:center;gap:16px;margin-top:20px}
.dots i{width:22px;height:22px;border-radius:11px;border:3px solid var(--ink)}.dots i.on{background:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{min-height:24px;margin-top:10px;text-align:center;font-size:17px;font-weight:800}
.scan{position:relative;width:200px;height:200px}
.scan b{position:absolute;width:44px;height:44px;border:6px solid var(--ink)}
.scan b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.scan b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.scan b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.scan b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.scan svg{position:absolute;inset:0}
.scan .line{position:absolute;left:12px;right:12px;height:5px;border-radius:3px;background:var(--coral);top:10px;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{50%{top:182px}}
.okbadge{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--mint);font-size:16px;font-weight:800}
.belt{position:relative;width:100%;height:190px}
.bagimg{position:absolute;left:100px;top:34px}
.bagimg.go{animation:ride 1.4s ease-in forwards}
@keyframes ride{to{transform:translateX(220px);opacity:0}}
.tag{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bagbtn{height:110px;border:3px solid var(--line);border-radius:22px;background:var(--card);display:grid;place-items:center}
.bagbtn:hover{border-color:var(--ink)}
.bagbtn.ok{background:var(--mint);border-color:var(--ink)}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:50%;font-family:var(--head);font-weight:700;background:var(--b,var(--sky))}
.stamp small{font-family:var(--text);font-size:13px;font-weight:800}
.stampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;justify-items:center}
.sheet{position:absolute;inset:0;background:rgba(31,36,48,.55);display:flex;align-items:flex-end;z-index:5}
.sheet>div{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 20px 28px;text-align:center;animation:rise .3s ease both}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.pass{margin:16px auto 0;width:260px;border:3px solid var(--ink);border-radius:20px;background:var(--card);padding:12px 14px;text-align:left;animation:tap 1.4s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(-14px)}}
.arc{position:relative;width:100%;height:200px;margin-top:14px;border-radius:28px;background:var(--sky);overflow:hidden}
.arc>svg{position:absolute;inset:0}
.jetpos{position:absolute;width:88px;transform:translate(-50%,-50%)}
.meter{height:14px;border-radius:7px;background:#fff;overflow:hidden}.meter i{display:block;height:100%;background:var(--coral);border-radius:7px;transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{border-radius:18px;background:var(--card);border:2px solid var(--line);padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:22px;line-height:24px}.stat span{font-size:13px;font-weight:800;color:var(--muted)}
.fact{min-height:78px;transition:opacity .3s}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.conf i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall 3.4s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.8}}
.slam{animation:slam .6s cubic-bezier(.2,1.6,.4,1) both .4s}
@keyframes slam{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:rotate(-10deg);opacity:1}}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{height:84px;border:2px solid var(--line);border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:800}
.rate button.on{background:var(--butter);border-color:var(--ink)}
.toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:9;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:16px;font-weight:800;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:48px;height:48px;border-radius:24px;border:3px solid var(--line)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}
.thumb{width:84px;height:56px;flex:none;border-radius:10px;overflow:hidden;background:var(--sky);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.conf{display:none}}
</style>

<main class="stage">
  <section class="device" aria-label="DigiYatra Kids prototype">
    <div id="app" class="scr"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </section>
  <aside class="controls" aria-label="Prototype controls">
    <h2>Prototype controls</h2>
    <p>Tap through the phone, or jump to any screen to review it.</p>
    <h3>Onboarding</h3>
    <div class="jg">
      <button class="jb" data-a="jump" data-to="welcome">Welcome</button>
      <button class="jb" data-a="jump" data-to="about">About me</button>
      <button class="jb" data-a="jump" data-to="handoff">Grown-up</button>
      <button class="jb" data-a="jump" data-to="face">Face pass</button>
      <button class="jb" data-a="jump" data-to="ready">All set</button>
    </div>
    <h3>Home</h3>
    <div class="jg">
      <button class="jb" data-a="jump" data-to="home">Home</button>
      <button class="jb" data-a="jump" data-to="stamps">Stamps</button>
      <button class="jb" data-a="jump" data-to="me">My account</button>
    </div>
    <h3>At the airport</h3>
    <div class="jg">
      <button class="jb" data-a="jump" data-to="map">Map</button>
      <button class="jb" data-a="jump" data-to="entry">Entry</button>
      <button class="jb" data-a="jump" data-to="checkin">Check-in</button>
      <button class="jb" data-a="jump" data-to="security">Security</button>
      <button class="jb" data-a="jump" data-to="gate">Gate</button>
    </div>
    <h3>Trip completion</h3>
    <div class="jg">
      <button class="jb" data-a="jump" data-to="boarded">Boarded</button>
      <button class="jb" data-a="jump" data-to="inflight">In flight</button>
      <button class="jb" data-a="jump" data-to="landed">Landed</button>
      <button class="jb" data-a="jump" data-to="arrivals">Bags</button>
      <button class="jb" data-a="jump" data-to="complete">Complete</button>
    </div>
    <button class="jb reset" data-a="reset">Restart prototype</button>
    <p>Demo only: no camera, upload or message leaves this page. The PIN and photos live in this tab and are forgotten on reload.</p>
  </aside>
</main>

<script>
(function(){
var KEY='dyk-proto-v1';
var DEF={name:'',age:null,flown:true,color:'#FF8A6B',who:null,face:false,papers:{school:false,aadhaar:false},onboarded:false,flights:[],tripDone:false,rating:null,sent:false};
var SAMPLE=[{c:'LKO',m:'Mar',b:'--butter'},{c:'GOI',m:'Jun',b:'--mint'},{c:'JAI',m:'Aug',b:'--sky'}];
var TRIP={from:'DEL',fromCity:'Delhi',to:'BOM',toCity:'Mumbai',flight:'AI 887',seat:'14A',dep:'07:35',arr:'09:50',gate:'B12',board:'07:05',dur:'2h 15m',km:'1,150'};
var ONB=['about','color','handoff','pin','papers','grownup','face','ready'];
var S=clone(DEF);
var V={screen:'welcome',hist:[],pin:null,pinCtx:null,pinBuf:'',pinFirst:null,pinMsg:'',shake:0,papersFrom:'onb',imgs:{},scan:'idle',bag:'idle',gateScan:false,bagPick:null,timers:[]};
var app=document.getElementById('app'),toastEl=document.getElementById('toast');

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var r=localStorage.getItem(KEY);if(r){S=Object.assign(clone(DEF),JSON.parse(r))}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function later(f,ms){var id=setTimeout(f,ms);V.timers.push(id);return id}
function every(f,ms){var id=setInterval(f,ms);V.timers.push(id);return id}
function clearTimers(){V.timers.forEach(function(t){clearTimeout(t);clearInterval(t)});V.timers=[]}
var tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show')},2400)}
function name(){return S.name&&S.name.trim()?esc(S.name.trim()):'friend'}
function say(first,short){return(S.flown||(S.age&&S.age>=12))?short:first}
function role(){var w=S.who;if(!w)return'your grown-up';if(w.role==='Someone else')return w.name?esc(w.name):'your grown-up';return w.name?esc(w.role)+' ('+esc(w.name)+')':esc(w.role)}
function level(n){return n<=0?['New Flyer',1]:n<3?['Cadet',3]:n<5?['Junior Pilot',5]:n<10?['Captain',10]:['Ace',n]}
function tripDate(){var d=new Date(Date.now()+3*864e5);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}

var P={chev:'<path d="M15 5l-7 7 7 7"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',check:'<path d="M5 12l5 5L20 7"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',belt:'<rect x="2.5" y="9" width="19" height="6" rx="3"/><rect x="9" y="8" width="6" height="8" rx="1.5"/>',bottle:'<path d="M10 2.5h4v3l1.5 2.5V20a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 8.5 20V8L10 5.5z"/><path d="M8.5 12h7"/>',jacket:'<path d="M8 3l-5 4 2 4 3-1.5V21h8V9.5L19 11l2-4-5-4-2 2h-4z"/>',snack:'<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".8"/><circle cx="14.5" cy="9" r=".8"/><circle cx="12" cy="15" r=".8"/>',rest:'<circle cx="12" cy="5" r="2.5"/><path d="M8 21v-8l-1.5-4h11L16 13v8M12 12v9"/>',id:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.5-1.5 1.5-2 2.5-2s2 .5 2.5 2M14 10h4M14 14h3"/>',star:'<path d="M12 6.5l1.7 3.6 3.9.5-2.9 2.7.8 3.9L12 15.300 8.500 17.200l.8-3.9-2.9-2.7 3.900-.5z"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5M15 19c0-1.8 1.2-3.2 3-3.6"/>',shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',bag:'<rect x="5" y="8" width="14" height="12" rx="2.5"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',seat:'<path d="M4 15h16M7 15v3M17 15v3M6 15a6 6 0 0 1 12 0"/>',del:'<path d="M9 5h11v14H9l-6-7z"/><path d="M13 9l4 6M17 9l-4 6"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',wave:'<path d="M3 12c3-4 6-4 9 0s6 4 9 0"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/>'};
function ic(n,s,sw){s=s||24;return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2.4)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}
function plane(s,rot){return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="transform:rotate('+(rot||0)+'deg)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>'}

function jetty(w,mood,o){o=o||{};var t=o.tail||S.color,k='#1F2430',f;
 if(mood==='happy')f='<path d="M97 51 Q102 44 107 51M121 51 Q126 44 131 51" fill="none" stroke="'+k+'" stroke-width="3.5" stroke-linecap="round"/><path d="M106 58 Q114 72 123 58 Z" fill="'+k+'" stroke="'+k+'" stroke-width="2.5" stroke-linejoin="round"/>';
 else if(mood==='wow')f='<circle cx="102" cy="50" r="6.500" fill="'+k+'"/><circle cx="126" cy="50" r="6.500" fill="'+k+'"/><circle cx="104" cy="48" r="2" fill="#fff"/><circle cx="128" cy="48" r="2" fill="#fff"/><ellipse cx="114" cy="65" rx="4.500" ry="5.500" fill="'+k+'"/>';
 else f='<circle cx="102" cy="50" r="5.500" fill="'+k+'"/><circle cx="126" cy="50" r="5.500" fill="'+k+'"/><circle cx="104" cy="48" r="1.800" fill="#fff"/><circle cx="128" cy="48" r="1.800" fill="#fff"/><path d="M108 59 Q114 67 121 59" fill="none" stroke="'+k+'" stroke-width="3.500" stroke-linecap="round"/>';

 return'<div class="top">'+back()+'<h1 style="font-size:28px">My airport adventure</h1></div>'+bubble(say('Five stops to go! I\'ll be with you at every one.','You\'ve flown before, so I\'ll keep tips short. 5 stops to go!'),'smile',96)+'<div class="stack" style="margin-top:12px;gap:2px">'+st(1,'Entry gate','Smile for the face scan',1)+st(2,'Check-in and bags','Say bye to your suitcase')+st(3,'Security check','Tray, belt, walk through')+st(4,'Find your gate','Gate '+TRIP.gate+', snack time')+st(5,'Board and take off','Scan your boarding pass')+'<div class="row" style="border:2px dashed #8A8F9A;background:transparent;min-height:56px;margin-top:6px"><span class="ico" style="--t:var(--mint)">'+plane(20,0)+'</span><span>After you land: collect your bag and meet '+role()+'</span></div></div><div class="pad"></div>'+cta('<button class="btn" data-a="go" data-to="entry">Let\'s go to stop 1 '+ic('arrow',24,2.8)+'</button>')},
entry:function(){var st=V.scan,bt=st==='done'?'<span class="okbadge">'+ic('check',18,3)+' Face matched</span>':(S.face?'<span class="okbadge" style="background:var(--sky)">Your face is already saved</span>':'');
 return stopHead(1,'Entry gate')+bubble(say('This is the entry gate. A camera will say hi to your face.','Look at the camera and smile, just like last time!'),st==='done'?'happy':'smile',112)+panel(270,scanBox())+'<div class="c" style="margin-top:12px;min-height:38px">'+bt+'</div>'+row('people','Stay close to '+role()+' while you walk in.','var(--butter)').replace('class="row"','class="row" style="margin-top:4px"')+'<div class="pad"></div>'+cta(st==='done'?nextBtn('Done! Next stop','checkin'):'<button class="btn" data-a="scan" data-t="entry"'+(st==='run'?' disabled':'')+'>'+(st==='run'?'Scanning...':'Look at the camera')+'</button>')},

 var belt='<div class="belt"><svg width="100%" height="190" viewBox="0 0 300 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="20" y="130" width="260" height="22" rx="11" fill="#CFC9BC" stroke="#1F2430" stroke-width="4"/>'+[40,100,160,220,260].map(function(x){return'<circle cx="'+x+'" cy="141" r="6" fill="#F7F4EE" stroke="#1F2430" stroke-width="3"/>'}).join('')+'<rect x="262" y="60" width="26" height="72" rx="8" fill="#fff" stroke="#1F2430" stroke-width="4"/></svg>'+(b==='done'?'':'<div class="bagimg'+(b==='moving'?' go':'')+'" style="left:calc(50% - 130px);top:46px">'+suitcase()+'</div>')+'</div>';

security:function(){return stopHead(3,'Security check')+bubble('You know this one! Pop these things in the tray.','smile',112)+'<div class="stack" style="margin-top:14px">'+row('phone','Phone and tablet go in the tray','var(--sky)')+row('belt','Belt and metal things go in the tray','var(--butter)')+row('bottle','Empty your water bottle','var(--mint)')+row('jacket','Jacket and shoes go in the tray','var(--blush)')+'</div><div class="row tile" style="--t:var(--mint);margin-top:12px;font-size:17px">'+'<span class="ico" style="--t:#fff">'+ic('shield',22)+'</span><span>Walk through the arch slowly. The officers are friendly helpers!</span></div><div class="pad"></div>'+cta(nextBtn('Through security! Next stop','gate'))},

 return stopHead(4,'Find your gate')+bubble('Gate '+TRIP.gate+' is your spot. You have a little time before we fly!','smile',112)+'<div class="card" style="margin-top:14px;border:3px solid var(--ink);padding:0;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px 4px"><div><div class="fine" style="margin:0">Gate</div><div style="font-family:var(--head);font-size:68px;line-height:68px;font-weight:700">'+TRIP.gate+'</div></div><div style="text-align:right"><div class="fine" style="margin:0">Boarding at</div><div style="font-family:var(--head);font-size:38px;line-height:42px;font-weight:700">'+TRIP.board+'</div></div></div><div style="display:flex;justify-content:space-between;padding:12px 18px;background:var(--butter);border-top:3px solid var(--ink);font-weight:800;font-size:17px"><span>Flight '+TRIP.flight+'</span><span>Seat '+TRIP.seat+' · Window</span></div></div><div class="lbl">While you wait, you can</div><div class="stack">'+row('bottle','Refill your water bottle','var(--sky)')+row('snack','Eat a snack to keep going','var(--mint)')+row('rest','Use the restroom before we fly','var(--blush)')+'</div><div class="pad"></div>'+cta('<button class="btn" data-a="gatescan">Scan my boarding pass '+ic('arrow',24,2.8)+'</button>')+sh},
boarded:function(){return stopHead(5,'Welcome aboard!')+panel(210,'<svg width="100%" height="210" viewBox="0 0 350 210" aria-hidden="true" style="position:absolute;inset:0">'+cloud(60,50)+cloud(290,170,1.1)+cloud(40,180,.8)+'</svg><div style="transform:rotate(-8deg)">'+jetty(210,'happy',{float:1})+'</div>')+bubble('Beep! Your pass worked. Window seat '+TRIP.seat+' is ready for you, '+name()+'!','happy',100)+'<div class="stack" style="margin-top:4px">'+row('seat','Seatbelt on, nice and snug','var(--sky)')+row('bag','Small bag goes under the seat in front','var(--butter)')+row('phone','Phone on flight mode','var(--mint)')+'</div><div class="pad"></div>'+cta('<button class="btn" data-a="go" data-to="inflight">Take off! '+plane(24,0)+'</button>')},
inflight:function(){var facts=['Planes fly above most clouds, where the air is smooth.','Every plane window has a tiny hole that keeps the air pressure balanced.','Delhi to Mumbai is about '+TRIP.km+' km. That is more than 10,000 football pitches laid end to end.'];
 return'<div class="top"><div style="flex:1"><div class="step">In the air</div></div><span class="pill" style="background:var(--mint)">'+TRIP.flight+'</span></div><h1 style="margin-top:10px">Flying to '+TRIP.toCity+'</h1><div class="arc"><svg width="100%" height="200" viewBox="0 0 350 200" aria-hidden="true"><circle cx="46" cy="40" r="22" fill="#F6C85F"/>'+cloud(250,40,.9)+cloud(80,110,.8)+cloud(300,120,.7)+'<path d="M40 160 Q175 -30 310 160" fill="none" stroke="#1F2430" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/><circle cx="40" cy="160" r="7" fill="#1F2430"/><circle cx="310" cy="160" r="7" fill="#1F2430"/><text x="40" y="188" text-anchor="middle" font-family="Baloo 2" font-weight="700" font-size="16" fill="#1F2430">'+TRIP.from+'</text><text x="310" y="188" text-anchor="middle" font-family="Baloo 2" font-weight="700" font-size="16" fill="#1F2430">'+TRIP.to+'</text></svg><div class="jetpos" id="jet">'+jetty(88,'happy')+'</div></div><div class="meter" style="margin-top:12px" aria-hidden="true"><i id="bar" style="width:0%"></i></div><div class="stats"><div class="stat"><b id="pct">0%</b><span>of the way</span></div><div class="stat"><b id="left">'+TRIP.dur+'</b><span>time left</span></div><div class="stat"><b id="alt">0 m</b><span>height</span></div></div><div class="card fact" id="fact" style="margin-top:12px"><div class="fine" style="margin:0">Jetty fact</div><div style="font-size:17px;line-height:23px;font-weight:800">'+facts[0]+'</div></div><div class="pad"></div>'+cta('<button class="btn ghost" data-a="go" data-to="landed">Skip to landing (demo)</button>')},
landed:function(){return'<div class="top"><div style="flex:1"><div class="step">Landed</div>'+bars(1,3)+'</div></div><h1 style="margin-top:16px">We landed!</h1>'+panel(200,'<svg width="100%" height="200" viewBox="0 0 350 200" aria-hidden="true" style="position:absolute;inset:0">'+cloud(70,45)+cloud(280,60,.9)+'<rect x="0" y="150" width="350" height="50" fill="#CFC9BC"/><path d="M20 175h50M110 175h50M200 175h50M290 175h40" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><div style="margin-top:14px">'+jetty(190,'happy',{float:1})+'</div>')+bubble('Welcome to '+TRIP.toCity+', '+name()+'! Great flying today.','happy',100)+'<div class="stack" style="margin-top:4px">'+row('seat','Stay seated until the seatbelt sign goes off','var(--sky)')+row('bag','Take your small bag and jacket','var(--butter)')+row('people','Say thank you to the crew','var(--mint)')+'</div><div class="pad"></div>'+cta(nextBtn('Next: collect my bag','arrivals'))},
arrivals:function(){var ok=V.bagPick==='ok',cols=['#7DB7E8','#C9A6E4','#4FB6A8'],bags=[{k:'a',c:cols[0]},{k:'ok',c:null},{k:'b',c:cols[1]},{k:'c',c:cols[2]}],h='';bags.forEach(function(b,i){h+='<button class="bagbtn'+(b.k==='ok'&&ok?' ok':'')+'" data-a="pick" data-v="'+b.k+'" aria-label="Bag '+(i+1)+(b.k==='ok'?', yellow with a star':'')+'">'+(b.k==='ok'?suitcase():otherBag(b.c,i))+'</button>'});
 return'<div class="top"><div style="flex:1"><div class="step">Arrivals</div>'+bars(2,3)+'</div></div><h1 style="margin-top:16px">Collect your bag</h1>'+bubble(ok?'Found it! Nice eyes, '+name()+'.':'Look for the yellow suitcase with a star. Tap it when you spot it!',ok?'happy':'wow',100)+'<div class="tag">'+h+'</div>'+(ok?'<div class="card tile" style="--t:var(--mint);margin-top:12px;display:flex;gap:12px;align-items:center;border:0"><span class="ico" style="width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;flex:none">'+ic('people',24)+'</span><div style="font-size:17px;font-weight:800;line-height:22px">Walk to the arrivals exit. '+role()+' will be waiting for you.</div></div>':'')+'<div class="pad"></div>'+cta(ok?'<button class="btn" data-a="go" data-to="complete">I found my grown-up! '+ic('arrow',24,2.8)+'</button>':'<button class="btn" disabled>Find your bag first</button>')},
complete:function(){var n=S.flights.length,L=level(n),prev=level(n-1),up=L[0]!==prev[0],nx=L[1],last=S.flights[n-1]||{};
 return'<div class="top"><div style="flex:1"><div class="step">Trip complete</div>'+bars(3,3)+'</div></div><h1 style="margin-top:12px">Trip complete!</h1><div class="card" style="margin-top:12px;background:var(--butter);border-color:var(--butter);display:flex;align-items:center;gap:16px"><div class="slam">'+stamp(TRIP.to,'just now','--blush',96)+'</div><div><div style="font-family:var(--head);font-size:22px;line-height:26px;font-weight:700">New stamp earned!</div><div style="font-weight:800;color:var(--body)">Flight '+n+' is in your passport.</div></div></div><div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-family:var(--head);font-size:22px;font-weight:700">'+(up?'Level up! '+L[0]:L[0])+'</div><span class="pill">'+n+' / '+nx+'</span></div><div class="meter" style="margin-top:8px;background:var(--sand)"><i style="width:'+Math.min(100,Math.round(n/nx*100))+'%"></i></div><div class="fine" style="margin-top:6px">'+(nx-n>0?(nx-n)+' more flight'+(nx-n===1?'':'s')+' to the next level':'Top level reached')+'</div></div><div class="stats"><div class="stat"><b>'+TRIP.km+'</b><span>km flown</span></div><div class="stat"><b>'+TRIP.dur+'</b><span>in the air</span></div><div class="stat"><b>'+TRIP.seat+'</b><span>window seat</span></div></div><div class="lbl">How was your flight?</div><div class="rate">'+[['smooth','Smooth'],['okay','Okay'],['bumpy','Bumpy']].map(function(r,i){return'<button data-a="rate" data-v="'+r[0]+'" class="'+(S.rating===r[0]?'on':'')+'" aria-pressed="'+(S.rating===r[0])+'"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="'+['#D5EFEA','#FBE9B7','#FFE0D6'][i]+'" stroke="#1F2430" stroke-width="2.500"/><circle cx="12" cy="14" r="1.800" fill="#1F2430"/><circle cx="22" cy="14" r="1.800" fill="#1F2430"/><path d="'+['M11 20 Q17 26 23 20','M11 22h12','M11 24 Q17 19 23 24'][i]+'" fill="none" stroke="#1F2430" stroke-width="2.500" stroke-linecap="round"/></svg>'+r[1]+'</button>'}).join('')+'</div>'+(S.rating?'<p class="fine c" style="margin-top:8px">Thanks, '+name()+'! '+({smooth:'Smooth skies are the best.',okay:'Every flight teaches us something.',bumpy:'Bumps are normal. You were brave!'})[S.rating]+'</p>':'')+'<div class="lbl">Tell '+role()+'</div><div class="card" style="display:flex;gap:12px;align-items:center"><div style="flex:1;font-size:17px;line-height:22px;font-weight:800">"'+name()+' landed safely in '+TRIP.toCity+' and found the suitcase."</div><button class="btn sm'+(S.sent?'':' dark')+'" data-a="send"'+(S.sent?' disabled':'')+'>'+(S.sent?ic('check',18,3)+'Sent':ic('send',18)+'Send')+'</button></div><p class="fine">Demo: no message is really sent.</p><div class="pad"></div>'+cta('<button class="btn" data-a="finishtrip">Back to my home '+ic('arrow',24,2.8)+'</button>')}
};

var AFTER={
inflight:function(){var p=0,bar=document.getElementById('bar'),pct=document.getElementById('pct'),left=document.getElementById('left'),alt=document.getElementById('alt'),jet=document.getElementById('jet'),fact=document.getElementById('fact'),box=jet.parentNode,fi=0;
 var facts=['Planes fly above most clouds, where the air is smooth.','Every plane window has a tiny hole that keeps the air pressure balanced.','Delhi to Mumbai is about '+TRIP.km+' km. That is more than 10,000 football pitches laid end to end.'];
 every(function(){p=Math.min(1,p+.1/12);var W=box.clientWidth/350,t=p,x=(1-t)*(1-t)*40+2*(1-t)*t*175+t*t*310,y=(1-t)*(1-t)*160+2*(1-t)*t*-30+t*t*160,dx=2*(1-t)*(175-40)+2*t*(310-175),dy=2*(1-t)*(-30-160)+2*t*(160+30),a=Math.atan2(dy,dx)*180/Math.PI;
  jet.style.left=(x*W)+'px';jet.style.top=((y-20)*(box.clientHeight/200))+'px';jet.style.transform='translate(-50%,-50%) rotate('+(a*.6)+'deg)';
  bar.style.width=Math.round(p*100)+'%';pct.textContent=Math.round(p*100)+'%';var mins=Math.round(135*(1-p));left.textContent=Math.floor(mins/60)+'h '+('0'+(mins%60)).slice(-2)+'m';alt.textContent=(Math.round(Math.min(1,p*8,(1-p)*8)*105)*100).toLocaleString('en-IN')+' m';
  if(p>=1)go('landed');},100);
 every(function(){fi=(fi+1)%facts.length;fact.style.opacity=0;later(function(){fact.lastChild.textContent=facts[fi];fact.style.opacity=1},300)},3800)},
complete:function(){var dev=document.querySelector('.device');var old=dev.querySelector('.conf');if(old)old.remove();var c=document.createElement('div');c.className='conf';c.setAttribute('aria-hidden','true');var cols=['#FF8A6B','#F6C85F','#4FB6A8','#7DB7E8','#C9A6E4'];for(var i=0;i<28;i++){var s=document.createElement('i');s.style.left=(Math.random()*100)+'%';s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*1.2)+'s';s.style.animationDuration=(2.6+Math.random()*1.6)+'s';c.appendChild(s)}dev.appendChild(c);later(function(){c.remove()},5200)}
};

function render(anim){clearTimers();if(V.screen!=='complete'){var cf=document.querySelector('.conf');if(cf)cf.remove()}var f=SC[V.screen]||SC.home;app.className='scr'+(anim===false?'':' in');app.innerHTML=f();if(anim!==false)app.scrollTop=0;if(AFTER[V.screen])AFTER[V.screen]()}
function go(to,replace){if(!replace)V.hist.push(V.screen);V.screen=to;
 if(to==='entry'||to==='face')V.scan='idle';if(to==='checkin')V.bag='idle';if(to==='gate')V.gateScan=false;if(to==='arrivals')V.bagPick=null;
 if(to==='complete'&&!S.tripDone){S.flights.push({c:TRIP.to,m:new Date().toLocaleDateString('en-IN',{month:'short'}),b:'--blush'});S.tripDone=true;S.rating=null;S.sent=false;save()}
 render()}
function backNav(){V.screen=V.hist.pop()||(S.onboarded?'home':'welcome');render()}
function tab(to){V.hist=[];V.screen=to;render()}
function demoFill(){if(!S.name){S.name='Aarav';S.age=9;S.flown=true}if(!S.who)S.who={role:'Mum',name:''};S.face=true;if(!S.papers.school&&!S.papers.aadhaar)S.papers={school:true,aadhaar:true};if(!S.onboarded){S.onboarded=true;if(S.flown&&!S.flights.length)S.flights=clone(SAMPLE)}save()}
function openPin(mode,next,from){V.pinCtx={mode:mode,next:next};V.pinBuf='';V.pinFirst=null;V.pinMsg='';V.papersFrom=from;go('pin')}
function pinKey(v){if(v==='del'){V.pinBuf=V.pinBuf.slice(0,-1);V.pinMsg='';render(false);return}if(V.pinBuf.length>=4)return;V.pinBuf+=v;V.pinMsg='';render(false);
 if(V.pinBuf.length===4)later(function(){var c=V.pinCtx,b=V.pinBuf;V.pinBuf='';
  if(c.mode==='set'){if(!V.pinFirst){V.pinFirst=b}else if(V.pinFirst===b){V.pin=b;V.pinFirst=null;go(c.next,true);return}else{V.pinFirst=null;V.pinMsg='Those did not match. Let\'s start again.';V.shake=1}}
  else{if(b===V.pin){go(c.next,true);return}V.pinMsg='That PIN is not right. Try again.';V.shake=1}
  render(false)},180)}

var ACT={
go:function(d){go(d.to)},back:backNav,tab:function(d){tab(d.to)},
age:function(d){S.age=+d.v;save();render(false)},
flown:function(d){S.flown=d.v==='1';save();render(false)},
color:function(d){S.color=d.v;save();render(false)},
startpin:function(){openPin('set','papers','onb')},
startverify:function(){openPin(V.pin?'verify':'set','papers','me')},
key:function(d){pinKey(d.v)},
sample:function(d){S.papers[d.k]=true;save();render(false)},
who:function(d){S.who={role:d.v,name:(S.who&&S.who.name)||''};save();render(false)},
scan:function(d){V.scan='run';render(false);later(function(){V.scan='done';if(d.t==='face'){S.face=true;save()}render(false)},1600)},
sendbag:function(){V.bag='moving';render(false);later(function(){V.bag='done';render(false)},1500)},
gatescan:function(){V.gateScan=true;render(false);later(function(){go('boarded')},1800)},
pick:function(d){if(d.v==='ok'){V.bagPick='ok';render(false)}else{toast('Not that one. Look for the yellow bag with a star!')}},
rate:function(d){S.rating=d.v;save();render(false)},
send:function(){S.sent=true;save();toast('Sent in this demo');render(false)},
finishonb:function(){S.onboarded=true;if(S.flown&&!S.flights.length)S.flights=clone(SAMPLE);save();V.hist=[];V.screen='home';render()},
finishtrip:function(){V.hist=[];V.screen='home';render()},
replay:function(){S.tripDone=false;if(S.flights.length&&S.flights[S.flights.length-1].c===TRIP.to)S.flights.pop();save();render(false)},
jump:function(d){var t=d.to,onb=['welcome','about','handoff','face','ready'].indexOf(t)>-1;if(!onb)demoFill();else if(t==='ready'||t==='face'){if(!S.name){S.name='Aarav';S.age=9}if(!S.who)S.who={role:'Mum',name:''}}
  if(t==='handoff'){V.hist=['about'];V.screen='handoff';render();return}
  if(t==='complete'&&S.tripDone){S.tripDone=false;if(S.flights.length&&S.flights[S.flights.length-1].c===TRIP.to)S.flights.pop()}
  V.hist=['home'];V.screen='';go(t,true);if(t==='home'||t==='stamps'||t==='me'||t==='welcome')V.hist=[]},
reset:function(){try{localStorage.removeItem(KEY)}catch(e){}S=clone(DEF);V.pin=null;V.imgs={};V.hist=[];V.screen='welcome';render()}
};

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='name'){S.name=t.value;save();var n=document.querySelector('[data-next]');if(n)n.disabled=!(S.name.trim()&&S.age)}
 else if(t.id==='gname'){S.who=S.who||{role:'Someone else',name:''};S.who.name=t.value;save()}});
document.addEventListener('change',function(e){var t=e.target;if(t.matches&&t.matches('input[type=file]')){var f=t.files&&t.files[0],k=t.dataset.k;if(!f)return;if(f.type.indexOf('image/')!==0){toast('Please choose a photo.');return}if(f.size>8e6){toast('That photo is too big. Try one under 8 MB.');return}var r=new FileReader();r.onload=function(){V.imgs[k]=r.result;S.papers[k]=true;save();render(false)};r.readAsDataURL(f)}});

load();V.screen=S.onboarded?'home':'welcome';render(false);
})();
</script>
